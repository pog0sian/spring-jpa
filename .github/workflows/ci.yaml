name: Spring boot CI

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  check-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Grant scripts permition
        run: chmod +x ./mvnw ./.test/run-test.sh

      - name: Load .env
        run: cat .env >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          RETRIES=30
          COUNT=0
          until docker compose exec -T postgres pg_isready -U postgres; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $RETRIES ]; then
              echo "PostgreSQL did not become ready in time"
              docker compose logs postgres
              exit 1
            fi
            echo "Waiting... ($COUNT/$RETRIES)"
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Compile Spring app
        run: ./mvnw -e -X clean package

      - name: Run Spring app
        run: |
          mkdir -p logs
          # Запускаем приложение и пишем stdout/stderr в файл
          nohup java -jar ./target/*.jar --server.port=${{ env.SERVER_PORT }} > logs/app.log 2>&1 &
          echo $! > logs/app.pid

      - name: Wait for Spring Boot
        run: |
          echo "Waiting for Spring Boot..."
          for i in {1..60}; do
            if curl -fsS "http://localhost:${{ env.SERVER_PORT }}/actuator/health" >/dev/null 2>&1; then
              echo "Spring Boot is up!"
              exit 0
            fi
            sleep 1
          done
          echo "Spring Boot did not start in time"
          echo "---- app.log ----"
          tail -n 300 logs/app.log || true
          exit 1

      - name: Run tests
        run: ./.test/run-test.sh
        env:
          BASE_URL: http://localhost:${{ env.SERVER_PORT }}