spring:
  application.name: spring-jpa

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false

  profiles:
    active: db

jwt:
  secret: ${JWT_SECRET:my-super-long-secret-key-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}
