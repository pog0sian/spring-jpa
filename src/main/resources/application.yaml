spring:
  application.name: spring-jpa

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false

  profiles:
    active: db

jwt:
  secret: ${JWT_SECRET:my-super-long-secret-key-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}
